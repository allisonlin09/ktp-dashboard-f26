<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KTPledge Hub</title>
<meta name="description" content="KTP Tau Chapter Fall 2026 pledge points.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: one centered column, a header with the logo, then a plain list of pledge names with their points. */
  :root{
    --bg:#F4F6FC;
    --surface:#FFFFFF;
    --border:#DBE1F5;
    --text:#181F34;
    --text-dim:#4B5480;
    --accent:#4C5FB0;
    --accent-strong:#2C3B7C;
    --neg:#B3402F;
    --font-display:'Sora',system-ui,sans-serif;
    --font-body:'Manrope',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A0D18; --surface:#141931; --border:#2A3260; --text:#EEF1FF; --text-dim:#A6AFD9;
      --accent:#8DAFFF; --accent-strong:#D4E1FF; --neg:#F08A78; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0D18; --surface:#141931; --border:#2A3260; --text:#EEF1FF; --text-dim:#A6AFD9;
    --accent:#8DAFFF; --accent-strong:#D4E1FF; --neg:#F08A78; color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    padding-block:40px 56px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px; margin:0 auto;}
  header{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
  .logo{width:48px; height:48px; border-radius:12px; flex:none; object-fit:cover; border:1px solid var(--border);}
  h1{font-family:var(--font-display); font-size:26px; font-weight:800; letter-spacing:-0.01em; margin:0; color:var(--accent-strong);}
  .sub{margin:2px 0 0; font-size:13px; color:var(--text-dim);}
  .updated{margin:22px 0 14px; font-family:var(--font-mono); font-size:12px; color:var(--text-dim);}
  .updated b{color:var(--text); font-weight:600;}
  ul{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden;}
  li{display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:14px 18px; border-bottom:1px solid var(--border);}
  li:last-child{border-bottom:none;}
  .name{font-weight:700; font-size:15px; min-width:0; overflow-wrap:anywhere;}
  .pts{font-family:var(--font-mono); font-weight:600; font-size:16px; font-variant-numeric:tabular-nums; color:var(--accent-strong); white-space:nowrap;}
  .pts.neg{color:var(--neg);}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <img class="logo" src="logo.png" alt="KTP logo">
    <h1>KTPledge Hub</h1>
  </header>
  <p class="updated">Last updated <b id="updated"></b></p>
  <ul id="list"></ul>
</div>

<script>
(function(){
  var UPDATED = "Oct 28, 2026";
  var POINTS = {
    "Matthew Lin":135, "Agnes Chen":109, "Selina Xu":106, "Leilani Ybarra":99, "Courtney Kijewski":91,
    "Hans Chiang":85, "Alice Zhao":45, "Jason Lee":33, "Yuki Watanabe":22, "Chloe Dalmacio":18,
    "Chloe Hoang":13, "Ryogo Otsuka":-17, "Kyle Banducci":-24, "Anushka Patil":-32, "Austin Chen":-49, "Iain Yang":-66
  };
  document.getElementById('updated').textContent = UPDATED;
  var list = document.getElementById('list');
  Object.keys(POINTS).sort(function(a,b){ return POINTS[b]-POINTS[a]; }).forEach(function(n){
    var p = POINTS[n], li = document.createElement('li');
    var name = document.createElement('span'); name.className = 'name'; name.textContent = n;
    var pts = document.createElement('span'); pts.className = 'pts' + (p<0 ? ' neg' : '');
    pts.textContent = (p<0 ? '−' : '') + Math.abs(p);
    li.appendChild(name); li.appendChild(pts); list.appendChild(li);
  });
})();
</script>
</body>
</html>
